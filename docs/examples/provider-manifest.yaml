kind: provider
name: local-docker
description: Runs Flows in local Docker containers.
platform: local
type: flow            # implemented as TMX tasks (vs. type: binary + a `binary:` path)

methods:
  bootstrap:
    - name: ensure-network
      type: exec
      with:
        command: docker network create tmx-net || true
  deploy:
    - name: start-container
      type: exec
      with:
        command: docker run -d --network tmx-net --name ${{ run.id }} ${{ environment.image }}
  clean:
    - name: stop-container
      type: exec
      with:
        command: docker rm -f ${{ run.id }}
  destroy:
    - name: remove-network
      type: exec
      with:
        command: docker network rm tmx-net || true
