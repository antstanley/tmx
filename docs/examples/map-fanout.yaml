kind: flow
name: deploy-to-regions
description: >-
  Bounded fan-out with the `map` task: build once, then run a per-region sub-flow
  for every region, collecting each region's output into an array. The Flow's task
  list still runs strictly in sequence — only the `map` task fans out internally.

inputs:
  regions:
    type: array
    description: Regions to deploy to.
    default: [us-east-1, eu-west-1, ap-southeast-2]

tasks:
  # `produces` declares this task's output shape so `${{ tasks.build.artifact }}`
  # below can be statically linted before the Flow runs.
  - name: build
    type: run
    produces:
      type: object
      required: [artifact]
      properties:
        artifact: { type: string }
    with:
      language: bash
      script: |
        npm run build
        echo '{"artifact":"dist.tgz"}'

  - name: deploy-regions
    type: map
    with:
      items: "${{ inputs.regions }}"   # an array in inputs/state
      as: region                       # each element bound as ${{ region }}
      concurrency: 3                    # bounded parallelism (default would be 1)
      continueOnError: true            # one region failing does not abort the rest
      task:                            # run once per region
        type: flow
        with:
          use: ./deploy/region.yaml
          inputs:
            region: "${{ region }}"
            artifact: "${{ tasks.build.artifact }}"
    # → state["deploy-regions"] = [ <region.yaml output>, ... ] in region order

  - name: report
    type: exec
    with:
      command: echo "deployed ${{ tasks.build.artifact }} across all regions"
