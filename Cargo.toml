[workspace]
resolver = "2"
members = [
    "crates/tmx-schema",
    "crates/tmx-core",
    "crates/tmx-adapters",
    "crates/tmx-testkit",
    "crates/tmx-cli",
    "crates/tmx-conformance",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
version = "0.1.0"
license = "MIT"
authors = ["Ant Stanley <ant@senzo.io>"]

# Shared, version-pinned dependencies: declared once here so every crate that opts in
# (e.g. `serde.workspace = true`) resolves the identical version — one source of truth.
# These four are the foundational data-model and error deps the schema/core tasks build on;
# the async and I/O adapter deps (tokio, reqwest, the S3 SDK, clap, uuid, jsonschema) land with
# their own tasks and MUST never be added to a pure crate (enforced by scripts/purity.sh).
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"

[workspace.lints.rust]
# TMX needs no `unsafe`; forbidding it keeps the trust surface at the dependency boundary only
# (architecture-principles.md §3). Re-asserted per crate via `#![forbid(unsafe_code)]`.
unsafe_code = "forbid"
# A dropped `#[must_use]` value is a silently swallowed error or ignored port handle — a bug,
# not a style nit (development-guidelines.md §Errors are data, not exceptions).
unused_must_use = "deny"

[workspace.lints.clippy]
# `unwrap()`/`expect()` in non-test code hide a panic that should be an asserted-impossible case
# or a typed `RunError` (architecture-principles.md §3). Denied here; `clippy.toml` re-permits
# them inside `#[cfg(test)]` where an unwrap IS the assertion.
unwrap_used = "deny"
expect_used = "deny"
