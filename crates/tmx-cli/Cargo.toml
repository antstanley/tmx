[package]
name = "tmx-cli"
description = "The `tmx` command-line binary: driving adapter and composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tmx"
path = "src/main.rs"

# The top of the dependency graph: depends on tmx-adapters (concrete ports), tmx-core (use cases),
# and tmx-schema (config/data).
[dependencies]
tmx-adapters = { path = "../tmx-adapters" }
tmx-core = { path = "../tmx-core" }
tmx-schema = { path = "../tmx-schema" }

# `clap` (derive) expresses the command surface and its flags (07 §Assumptions); `serde_json` renders
# the final Pipeline state as the one JSON object on stdout; `tokio` is the async runtime `main` drives
# the use cases on — the real process adapter awaits genuine tokio I/O, so the CLI (never a pure crate)
# needs a runtime. This is the driving-adapter crate outside the purity boundary, so these deps are
# expected here.
clap = { version = "4", features = ["derive"] }
# `async-trait` restores object safety for the `QueryRuns` driving-port impl behind `tmx runs` — the
# same trait-support macro the ports and adapters carry.
async-trait = "0.1"
serde_json = { workspace = true }
# `signal` installs the SIGINT (Ctrl-C) handler and `time` drives the `--timeout`/grace timers the
# cancellation watchers use (task 29); `macros`/`rt-multi-thread` are the runtime `main` drives on.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

# The S3-compatible object-store (`store`) executor is opt-in: this feature forwards to the adapter's
# own `store` feature so the composition root wires the real `S3ObjectStore` (and advertises the
# `store` capability) instead of the denying stub. Off by default, mirroring `tmx-adapters`.
[features]
default = []
store = ["tmx-adapters/store"]
# The `chat-completion` executor is opt-in: this feature forwards to the adapter's own `chat` feature
# so the composition root wires the real `ChatCompletionsModel` (and advertises the `chat` capability)
# instead of the denying stub. Off by default, mirroring `store`.
chat = ["tmx-adapters/chat"]

[lints]
workspace = true
