[package]
name = "tmx-adapters"
description = "Built-in adapters implementing the tmx-core driven ports (process, HTTP, fs, store, chat, …)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Depends on tmx-core (the port traits it implements) and tmx-schema. This is the crate where the
# async runtime and heavy I/O deps (tokio, reqwest, the S3 SDK, uuid, a JSON-Schema validator)
# live — each behind a Cargo feature — arriving with their adapter tasks (13–24).
[dependencies]
tmx-core = { path = "../tmx-core" }
tmx-schema = { path = "../tmx-schema" }

# The source-loader stack (task 13). `serde_json` is the one JSON model every format lands in;
# `preserve_order` makes `Value::Object` an insertion-ordered `IndexMap` so the task *map* form keeps
# its source key order end-to-end (03 §Source loading — "feed keys to an order-preserving map").
# `serde_yaml_ng` / `toml` are the YAML / TOML front-ends, each deserialising straight into the same
# `serde_json::Value`; JSON and JSONC ride `serde_json` directly. `async-trait` is the same
# trait-support macro the ports carry — it restores object safety for the async `SourceLoader` /
# `ReferenceResolver` methods so they can be injected as `dyn Port`.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml = "0.8"
async-trait = "0.1"

# The `SchemaValidator` adapter (task 14). `jsonschema` is the JSON-Schema-2020-12 engine backing
# `tmx validate` / preflight, at parity with `scripts/validate.sh`; `default-features = false` drops
# its optional HTTP retriever so no `reqwest` edge arrives here — cross-file `$ref`s are resolved
# in-process from the embedded schemas, never over the network. Pinned to the same 0.46 line the
# `tmx-core` conformance tests already use.
jsonschema = { version = "0.46", default-features = false }

# The OS-process `ProcessRunner` adapter (task 16). `tokio` is the async runtime the effecting
# boundary awaits — the only async runtime in the tree, and it lives *here*, never in a pure crate
# (enforced by scripts/purity.sh). It is `optional` and pulled in solely by the `process` feature so
# `--no-default-features` yields a build with no async runtime at all. Feature set is the minimum the
# adapter needs: `process` (spawn + piped stdio), `io-util` (capped pipe reads / stdin writes),
# `time` (the per-task timeout), `rt` + `rt-multi-thread` + `macros` (the runtime and `#[tokio::test]`).
tokio = { version = "1", optional = true, features = [
    "process",
    "io-util",
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
] }

# `process` gates the OS-process adapter and its `tokio` edge; it is on by default so the standard
# `cargo nextest run` exercises the real-process adapter tests (they are never silently skipped),
# while `--no-default-features` drops tokio for a minimal build.
[features]
default = ["process"]
process = ["dep:tokio"]

# Test-only. `indexmap` is the ordered map the `ProcessSpec.env` field uses; the process-adapter
# tests build specs directly, so they need to name the same map type the port declares.
[dev-dependencies]
indexmap = { workspace = true }

[lints]
workspace = true
