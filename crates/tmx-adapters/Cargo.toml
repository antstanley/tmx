[package]
name = "tmx-adapters"
description = "Built-in adapters implementing the tmx-core driven ports (process, HTTP, fs, store, chat, …)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Depends on tmx-core (the port traits it implements) and tmx-schema. This is the crate where the
# async runtime and heavy I/O deps (tokio, reqwest, the S3 SDK, uuid, a JSON-Schema validator)
# live — each behind a Cargo feature — arriving with their adapter tasks (13–24).
[dependencies]
tmx-core = { path = "../tmx-core" }
tmx-schema = { path = "../tmx-schema" }

# The source-loader stack (task 13). `serde_json` is the one JSON model every format lands in;
# `preserve_order` makes `Value::Object` an insertion-ordered `IndexMap` so the task *map* form keeps
# its source key order end-to-end (03 §Source loading — "feed keys to an order-preserving map").
# `serde_yaml_ng` / `toml` are the YAML / TOML front-ends, each deserialising straight into the same
# `serde_json::Value`; JSON and JSONC ride `serde_json` directly. `async-trait` is the same
# trait-support macro the ports carry — it restores object safety for the async `SourceLoader` /
# `ReferenceResolver` methods so they can be injected as `dyn Port`.
serde_json = { workspace = true, features = ["preserve_order"] }
# The ordered map the port request/response types (`HttpRequest`/`HttpResponse` headers, `query`) use;
# the HTTP adapter builds response headers into one, so it names the same type the port declares.
indexmap = { workspace = true }
serde_yaml_ng = "0.10"
toml = "0.8"
async-trait = "0.1"

# The `SchemaValidator` adapter (task 14). `jsonschema` is the JSON-Schema-2020-12 engine backing
# `tmx validate` / preflight, at parity with `scripts/validate.sh`; `default-features = false` drops
# its optional HTTP retriever so no `reqwest` edge arrives here — cross-file `$ref`s are resolved
# in-process from the embedded schemas, never over the network. Pinned to the same 0.46 line the
# `tmx-core` conformance tests already use.
jsonschema = { version = "0.46", default-features = false }

# The `IdGenerator` adapter (task 17): a time-ordered UUIDv7 per run. `uuid` is the canonical
# generator; the `v7` feature pulls the timestamp+random layout (getrandom-backed). It lives here in
# the impure adapters crate, never in a pure crate. Rendered lowercase-hyphenated, a UUIDv7 matches
# the `RunId` schema pattern exactly, so `RunId::new` cannot reject it.
uuid = { version = "1", features = ["v7"] }

# The OS-process `ProcessRunner` adapter (task 16). `tokio` is the async runtime the effecting
# boundary awaits — the only async runtime in the tree, and it lives *here*, never in a pure crate
# (enforced by scripts/purity.sh). It is `optional` and pulled in solely by the `process` feature so
# `--no-default-features` yields a build with no async runtime at all. Feature set is the minimum the
# adapter needs: `process` (spawn + piped stdio), `io-util` (capped pipe reads / stdin writes),
# `time` (the per-task timeout), `rt` + `rt-multi-thread` + `macros` (the runtime and `#[tokio::test]`).
# `sync` adds `tokio::sync::Semaphore`, the bound behind the concurrent `TokioScheduler` (task 18).
tokio = { version = "1", optional = true, features = [
    "process",
    "io-util",
    "time",
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
] }

# The `HttpClient` (`fetch`) adapter (task 20). `reqwest` is the host HTTP client the effecting
# boundary awaits — the only HTTP client in the tree, confined here behind the `http` Cargo feature
# so `--no-default-features` drops it (and its `tokio`/TLS edge) for a minimal build. `rustls-tls`
# gives HTTPS with no system-OpenSSL dependency; `default-features = false` drops reqwest's own
# default TLS/proxy stack so only the pieces the adapter needs are pulled. The adapter reads the
# response body in bounded chunks (`Response::chunk`) so it never buffers past the captured-output
# cap, and holds two clients (redirect-following and not) so a per-request `followRedirects` is
# honoured despite reqwest's redirect policy being a per-client setting.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
] }

# The concurrent `TokioScheduler` (task 18) drives up to `concurrency` bounded, non-`'static` element
# futures at once and collects them in index order. `futures-util`'s `join_all` is the order-preserving
# concurrent driver; combined with a `tokio::sync::Semaphore` it bounds in-flight work without
# spawning (the element futures borrow the caller's scope, so they are not `'static`). `alloc` is the
# only feature `join_all` needs — no executor, no I/O edge of its own.
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "alloc",
] }

# `process` gates the OS-process adapter and its `tokio` edge; it is on by default so the standard
# `cargo nextest run` exercises the real-process adapter tests (they are never silently skipped),
# while `--no-default-features` drops tokio for a minimal build. It also gates the concurrent
# `TokioScheduler`, which shares the same `tokio` runtime edge (plus `futures-util`).
[features]
default = ["process", "http", "fs"]
process = ["dep:tokio", "dep:futures-util"]
# The local-filesystem (`file`) adapter. It reaches only for `std::fs`, so it pulls no extra
# dependency — the feature exists solely to gate the module so a minimal build can drop it, keeping
# the `file` executor on the same opt-out footing as the other effecting adapters.
fs = []
# The HTTP (`fetch`) adapter and its `reqwest`/`tokio` edge, on by default so the standard
# `cargo nextest run` exercises the real-request adapter tests against a local server. `--no-default-features`
# drops it (and `reqwest`) for a minimal build. It shares the same `tokio` runtime edge as `process`.
http = ["dep:reqwest", "dep:tokio"]

# Test-only. `indexmap` is the ordered map the `ProcessSpec.env` field uses; the process-adapter
# tests build specs directly, so they need to name the same map type the port declares.
[dev-dependencies]
indexmap = { workspace = true }

[lints]
workspace = true
