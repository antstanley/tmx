[toolchain]
# Pinned to the exact MSRV (development-guidelines.md §Toolchain): a single deterministic stable
# release every crate builds against, matching `rust-version = "1.96.1"` in the workspace manifest.
# Raising this is a deliberate, CHANGELOG-noted change, never an automatic follow of stable.
channel = "1.96.1"
components = ["rustfmt", "clippy"]
